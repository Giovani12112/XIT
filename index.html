<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliveira_OTM V3 | Elite Panel</title>
    <style>
        body { 
            background-color: #0d1117; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0; 
        }
        .main-card { 
            width: 90%; 
            max-width: 400px; 
            background: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 24px; 
            padding: 25px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.7); 
            text-align: center; 
        }
        h2 { color: #58a6ff; font-weight: 800; margin-bottom: 25px; letter-spacing: 1px; }
        
        .input-area { text-align: left; margin-bottom: 20px; }
        label { font-size: 11px; color: #8b949e; text-transform: uppercase; font-weight: bold; margin-left: 5px; }
        
        textarea { 
            width: 100%; 
            height: 100px; 
            background: #0d1117; 
            border: 1px solid #30363d; 
            border-radius: 12px; 
            color: #58a6ff; 
            padding: 12px; 
            font-family: 'Courier New', monospace; 
            font-size: 12px; 
            resize: none; 
            box-sizing: border-box; 
            margin-top: 8px;
        }

        .btn { 
            width: 100%; 
            padding: 18px; 
            border: none; 
            border-radius: 15px; 
            font-weight: 800; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            margin-bottom: 15px; 
            font-size: 14px; 
            text-transform: uppercase;
            text-decoration: none;
            display: block;
        }
        
        .btn-elite { 
            background: linear-gradient(135deg, #8957e5 0%, #6f42c1 100%); 
            color: white; 
            box-shadow: 0 4px 15px rgba(137, 87, 229, 0.3);
        }
        
        .btn-download { 
            background: #00d2ff; 
            color: #050505; 
            display: none; 
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        .btn:active { transform: scale(0.98); }

        #status { 
            font-size: 13px; 
            font-weight: bold; 
            margin: 15px 0; 
            min-height: 20px; 
            padding: 10px;
            border-radius: 8px;
        }
        
        .version { color: #8b949e; font-size: 11px; margin-top: 20px; opacity: 0.6; }
    </style>
</head>
<body>

<div class="main-card">
    <h2>OLIVEIRA_OTM V3</h2>
    
    <div class="input-area">
        <label>Calibração Remota (Rollout JSON)</label>
        <textarea id="input-rollout" placeholder='Cole o código de análise aqui...'></textarea>
        
        <button class="btn btn-elite" onclick="ativarPainelElite()">VINCULAR HARDWARE ELITE</button>
    </div>

    <div id="status"></div>

    <!-- BOTÃO MODIFICADO PARA DOWNLOAD DIRETO DO ARQUIVO ASSINADO -->
    <a href="Oliveira_OTM_V3_Assinado.mobileconfig" id="btn-dl" class="btn btn-download" download>
        BAIXAR PERFIL FULL OPTIMIZED
    </a>

    <div class="version">Status: Servidor Online | v3.0.4</div>
</div>

<script>
    const DATABASE_ELITE = {
        "68fbde79fac6f845b7757adf": { nome: "iPhone Elite (Calibrado)" }
    };

    function ativarPainelElite() {
        const rawInput = document.getElementById('input-rollout').value;
        const statusBox = document.getElementById('status');
        const dlButton = document.getElementById('btn-dl');

        try {
            const data = JSON.parse(rawInput);
            const hardwareId = data.factorPackIds[0];

            if (DATABASE_ELITE[hardwareId]) {
                const info = DATABASE_ELITE[hardwareId];
                
                statusBox.innerHTML = `✅ ${info.nome} VINCULADO!<br>Acesso liberado ao arquivo assinado.`;
                statusBox.style.color = "#39d353";
                statusBox.style.backgroundColor = "rgba(57, 211, 83, 0.1)";
                
                // REVELA O BOTÃO DE DOWNLOAD DO ARQUIVO REAL
                dlButton.style.display = "block";
                
            } else {
                statusBox.innerHTML = "❌ Hardware não compatível com a V3.";
                statusBox.style.color = "#f85149";
                statusBox.style.backgroundColor = "rgba(248, 81, 73, 0.1)";
            }
        } catch (e) {
            statusBox.innerHTML = "⚠️ Erro: Cole o JSON completo do Rollout!";
            statusBox.style.color = "#f85149";
        }
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliveira_OTM V3 | Painel Elite</title>
    <style>
        body { background-color: #0d1117; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .main-card { width: 100%; max-width: 400px; background: #161b22; border: 1px solid #30363d; border-radius: 20px; padding: 20px; text-align: center; }
        h2 { color: #58a6ff; }
        textarea { width: 100%; height: 80px; background: #0d1117; border: 1px solid #30363d; border-radius: 10px; color: #58a6ff; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-elite { background: #8957e5; color: white; }
        /* O BOTÃO COMEÇA ESCONDIDO */
        #btn-dl { background: #00d2ff; color: black; display: none; } 
        #status { font-size: 14px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="main-card">
    <h2>Oliveira_OTM V3</h2>
    
    <div style="text-align: left; margin-bottom: 20px;">
        <label style="font-size: 12px; color: #8b949e;">CALIBRAÇÃO REMOTA (ROLLOUT)</label>
        <textarea id="input-rollout" placeholder='Cole o JSON aqui...'></textarea>
        <button class="btn btn-elite" onclick="ativarElite()">VINCULAR HARDWARE ELITE</button>
    </div>

    <!-- BOTÃO DE DOWNLOAD -->
    <button id="btn-dl" class="btn" onclick="baixarPerfilConfigurado()">
        BAIXAR PERFIL CALIBRADO
    </button>

    <div id="status"></div>
</div>

<script src="app.js"></script>
<script>
    // Dados do seu hardware
    const IDs_ELITE = {
        "68fbde79fac6f845b7757adf": { fps: 120, jitter: 0.05, nome: "iPhone Elite (Calibrado)" }
    };

    function ativarElite() {
        const raw = document.getElementById('input-rollout').value;
        const statusDiv = document.getElementById('status');
        const botaoDownload = document.getElementById('btn-dl');

        try {
            const data = JSON.parse(raw);
            const factorId = data.factorPackIds[0];

            if (IDs_ELITE[factorId]) {
                const config = IDs_ELITE[factorId];
                
                // Salva os dados
                localStorage.setItem('otm_fps', config.fps);
                localStorage.setItem('otm_jitter', config.jitter);
                
                // 1. Mostra a mensagem verde
                statusDiv.innerHTML = `✅ ${config.nome} ATIVADO COM SUCESSO!`;
                statusDiv.style.color = "#39d353";
                
                // 2. FORÇA O BOTÃO A APARECER (AQUI ESTÁ A CHAVE)
                botaoDownload.style.display = "block";
                
            } else {
                statusDiv.innerHTML = "❌ Hardware não reconhecido.";
                statusDiv.style.color = "#f85149";
            }
        } catch (e) {
            alert("Erro no código! Cole o JSON completo.");
        }
    }
</script>

</body>
</html>
